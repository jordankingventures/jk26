name: Kalshi Market Making (Taylor Swift daily)

on:
  # Alleen handmatig/via API te starten -- cron-job.org triggert deze workflow
  # net als de fetch_*.yml workflows, GitHub's eigen schedule-trigger wordt
  # bewust niet gebruikt (zie fetch.yml).
  #
  # VEILIGHEID: dit script (kalshi_auto_taylor.py) draait standaard in DRY
  # RUN en verstuurt dus niets naar Kalshi, ook niet als deze workflow wel
  # getriggerd wordt. Pas als de secret KALSHI_DRY_RUN op "false" staat
  # worden er echte orders geplaatst -- dat zet je zelf aan wanneer je
  # daadwerkelijk live wilt gaan (Settings -> Secrets and variables ->
  # Actions).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements-kalshi.txt

      - name: Run market maker (Taylor Swift)
        env:
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_ENV: ${{ secrets.KALSHI_ENV }}
          KALSHI_DRY_RUN: ${{ secrets.KALSHI_DRY_RUN }}
        run: python scripts/kalshi_auto_taylor.py

      # LET OP: de orderstatus (data/kalshi_state.json) staat sinds nov 2026 in
      # .gitignore en wordt NIET meer naar de openbare repo gecommit -- dat zou je
      # orders en strategie voor iedereen zichtbaar maken. Zonder opgeslagen status
      # weet de volgende run niet welke dag al gequote is. Zet deze workflow dus pas
      # live (KALSHI_DRY_RUN=false) nadat de status ergens privé wordt bewaard.
      - name: Status niet committen (openbare repo)
        run: echo "kalshi_state.json wordt bewust niet gecommit (openbare repo)."
