name: Fetch YouTube Views (Taylor Swift)

on:
  # GitHub's eigen schedule-trigger is bewust uitgeschakeld: die vuurde te
  # onregelmatig af (soms uren later dan gepland) en zorgde voor inconsistente
  # gaten in de data. cron-job.org triggert deze workflow nu betrouwbaar elke
  # 15 minuten via de API (workflow_dispatch), dus die is voldoende.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run fetch script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch_views.py taylor

      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yt_data.json yt_video_ids.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen om te committen"
            exit 0
          fi
          git commit -m "Update views $(date -u '+%Y-%m-%d %H:%M') UTC"

          # Andere artiest-workflows pushen naar dezelfde branch en kunnen tegelijk
          # lopen. Bij een non-fast-forward reject rebasen we op de nieuwste main
          # en proberen opnieuw -- werkt altijd schoon, want elke workflow raakt
          # zijn eigen bestanden. Als de rebase zelf conflicteert (bv. twee
          # gelijktijdige runs van DEZELFDE workflow die allebei verse data
          # pushen), heeft remote main al recente data van de andere run; dan
          # laten we onze eigen update varen in plaats van te blijven vechten.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push mislukt (poging $i/5), main is intussen gewijzigd -- rebasen en opnieuw proberen..."
            git fetch origin main
            if git rebase origin/main; then
              sleep $((RANDOM % 4 + 1))
              continue
            fi
            git rebase --abort
            echo "Rebase-conflict (waarschijnlijk een gelijktijdige dubbele run) -- eigen update overgeslagen, remote main heeft al recente data."
            exit 0
          done
          echo "::error::Kon na 5 pogingen niet pushen naar main"
          exit 1
