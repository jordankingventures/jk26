name: Fetch YouTube Views

on:
  schedule:
    - cron: '*/15 * * * *'  # elke 15 minuten
  workflow_dispatch:         # ook handmatig te starten

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run fetch script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch_views.py

      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yt_data.json yt_video_ids.json
          git diff --staged --quiet || git commit -m "Update views $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
