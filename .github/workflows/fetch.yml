name: Fetch YouTube Views (Taylor Swift)

on:
  # GitHub's eigen schedule-trigger is bewust uitgeschakeld: die vuurde te
  # onregelmatig af (soms uren later dan gepland) en zorgde voor inconsistente
  # gaten in de data. cron-job.org triggert deze workflow nu betrouwbaar elke
  # 15 minuten via de API (workflow_dispatch), dus die is voldoende.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run fetch script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch_views.py taylor

      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yt_data.json yt_video_ids.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen om te committen"
            exit 0
          fi
          git commit -m "Update views $(date -u '+%Y-%m-%d %H:%M') UTC"

          # De Drake-workflow pusht naar dezelfde branch en kan tegelijk lopen;
          # bij een non-fast-forward reject rebasen we op de nieuwste main en
          # proberen opnieuw (beide workflows raken losse bestanden, dus een
          # conflict is hier vrijwel uitgesloten).
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push mislukt (poging $i/5), main is intussen gewijzigd -- rebasen en opnieuw proberen..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 4 + 1))
          done
          echo "::error::Kon na 5 pogingen niet pushen naar main"
          exit 1
