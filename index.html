<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT View Tracker</title>
  <style>
    :root {
      --bg: #0f0f13; --surface: #1a1a24; --surface2: #22222f;
      --border: #2a2a3a; --accent: #7c5cfc; --accent2: #fc5c7d;
      --green: #2ecc71; --text: #e8e8f0; --muted: #6666aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 20px 20px 60px;
      max-width: 1100px; margin: 0 auto;
      overflow-x: hidden;
    }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
    h1 { font-size: 1.05rem; font-weight: 700; color: var(--text); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    h1 .subtitle { font-size: 0.68rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

    /* Artiest-tabs */
    .tabs { display: flex; gap: 5px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab {
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      color: var(--muted); font-size: 0.76rem; font-weight: 600; padding: 5px 12px; cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: #fff; background: var(--accent); border-color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 0.75rem; color: var(--muted); padding: 4px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
    .badge.ok { color: var(--green); border-color: var(--green); }
    .badge.err { color: var(--accent2); border-color: var(--accent2); }
    button.refresh {
      background: var(--accent); border: none; border-radius: 7px;
      color: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 600;
      padding: 6px 14px; transition: opacity .15s;
    }
    button.refresh:hover { opacity: .85; }
    button.refresh:disabled { opacity: .4; cursor: not-allowed; }

    /* Log */
    .log-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface2);
    }
    .log-header h2 { font-size: 0.75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .log-empty { padding: 16px; color: var(--muted); font-size: 0.8rem; }

    #log-body { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .log-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .log-table th {
      text-align: left; color: var(--muted); font-size: 0.66rem;
      text-transform: uppercase; letter-spacing: .05em;
      padding: 6px 12px; border-bottom: 1px solid var(--border); font-weight: 600; white-space: nowrap;
    }
    .log-table td { padding: 6px 12px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .log-table tr:last-child td { border-bottom: none; }
    .log-table tr:hover td { background: var(--surface2); }
    .new-row td { animation: rowFade .6s ease; }
    @keyframes rowFade { from { background: #7c5cfc18; } to { background: transparent; } }

    /* Dag-groepering in refresh log (inklapbaar) */
    .day-row { cursor: pointer; user-select: none; }
    .day-row td { background: var(--surface2); padding: 7px 12px 6px; border-bottom: 1px solid var(--border); }
    .day-row:hover td { background: var(--surface2); filter: brightness(1.12); }
    .day-row:first-child td { border-top: none; }
    .day-row-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; width: 100%; }
    .day-label { flex: 1 1 auto; white-space: nowrap; font-weight: 700; font-size: 0.77rem; text-transform: capitalize; color: var(--text); }
    .day-chevron { display: inline-block; width: 14px; color: var(--muted); font-size: 0.7rem; }
    .day-badge { margin-left: 8px; padding: 2px 8px; font-size: 0.65rem; vertical-align: 1px; }
    .badge.release { color: var(--accent); border-color: var(--accent); cursor: help; }
    .week-row .day-label { padding-left: 16px; text-transform: none; }
    .older-row .day-label { text-transform: none; }
    .day-total { flex: 0 0 auto; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.8rem; white-space: nowrap; }

    /* Berekend 00:00-record onderaan elke dag */
    .midnight-row td { font-style: italic; color: var(--muted); border-bottom: 1px dashed var(--border); cursor: help; }
    .midnight-row:hover td { background: var(--surface2); }
    .est-tag { font-size: 0.6rem; font-style: normal; text-transform: uppercase; letter-spacing: .03em; padding: 1px 6px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); margin-left: 4px; }

    /* Delta colours */
    .pos { color: var(--green); } .neg { color: var(--accent2); } .neu { color: var(--muted); }

    /* Video table (inklapbaar) */
    .video-details { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    .video-summary {
      display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer;
      padding: 10px 16px; background: var(--surface2);
    }
    .video-summary::-webkit-details-marker { display: none; }
    .video-summary h2 { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .summary-chevron { display: inline-block; color: var(--muted); font-size: 0.7rem; transition: transform .15s; }
    .video-details[open] .summary-chevron { transform: rotate(90deg); }
    .video-details[open] .video-summary { border-bottom: 1px solid var(--border); }

    .section-header { display: flex; align-items: center; justify-content: flex-end; margin: 12px 16px 10px; gap: 10px; flex-wrap: wrap; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar input[type=text] {
      background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-size: 0.82rem; padding: 6px 12px; width: 220px; max-width: 100%;
    }
    .toolbar input[type=text]:focus { outline: none; border-color: var(--accent); }
    .toolbar select {
      background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-size: 0.8rem; padding: 6px 10px; cursor: pointer;
    }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-top: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    thead { background: var(--surface2); }
    th {
      text-align: left; color: var(--muted); font-weight: 600;
      font-size: 0.66rem; text-transform: uppercase; letter-spacing: .05em;
      padding: 7px 12px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap;
    }
    th:hover { color: var(--text); }
    td { padding: 6px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .rank { color: var(--muted); font-size: 0.75rem; width: 32px; }
    .thumb img { width: 60px; height: 34px; object-fit: cover; border-radius: 3px; display: block; }
    .video-title a { color: var(--text); text-decoration: none; font-weight: 500; }
    .video-title a:hover { color: var(--accent); }
    .vid-date { color: var(--muted); font-size: 0.72rem; margin-top: 2px; }
    .views-num { font-variant-numeric: tabular-nums; font-weight: 600; }

    .state-box { text-align: center; padding: 48px 20px; color: var(--muted); }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-txt { color: var(--accent2); font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; }

    /* Mobiel */
    @media (max-width: 640px) {
      body { padding: 14px 10px 40px; }
      header { flex-wrap: wrap; gap: 8px; }
      h1 { font-size: 0.92rem; }
      .header-right { width: 100%; justify-content: space-between; }

      .log-table, table { font-size: 0.72rem; }
      .log-table th, table th { padding: 5px 7px; }
      .log-table td, table td { padding: 5px 7px; }

      .section-header { gap: 8px; }
      .toolbar { width: 100%; }
      .toolbar input[type=text] { flex: 1 1 auto; width: auto; min-width: 0; }
      .toolbar select { flex: 0 0 auto; }

      .day-row td { padding: 7px 7px 6px; }
      .day-label { font-size: 0.73rem; }
      .day-total { font-size: 0.76rem; }
      .midnight-row td { padding: 5px 7px; }

      .thumb img { width: 44px; height: 25px; }
      .rank { width: 22px; }
    }
  </style>
</head>
<body>

<header>
  <h1><span id="artist-name">Taylor Swift</span><span class="subtitle">View Tracker</span></h1>
  <div class="header-right">
    <span class="badge" id="badge-updated">Laden...</span>
    <button class="refresh" id="btn-refresh" onclick="loadData()">↻ Ververs</button>
  </div>
</header>

<div class="tabs" id="artist-tabs">
  <button class="tab active" data-artist="taylor" onclick="switchArtist('taylor')">Taylor Swift</button>
  <button class="tab" data-artist="drake" onclick="switchArtist('drake')">Drake</button>
  <button class="tab" data-artist="wallen" onclick="switchArtist('wallen')">Morgan Wallen</button>
  <button class="tab" data-artist="badbunny" onclick="switchArtist('badbunny')">Bad Bunny</button>
  <button class="tab" data-artist="ariana" onclick="switchArtist('ariana')">Ariana Grande</button>
  <button class="tab" data-artist="youngboy" onclick="switchArtist('youngboy')">YoungBoy NBA</button>
  <button class="tab" data-artist="bieber" onclick="switchArtist('bieber')">Justin Bieber</button>
</div>

<!-- Log -->
<div class="log-wrap">
  <div class="log-header">
    <h2>Refresh log</h2>
  </div>
  <div id="log-body"><div class="log-empty"><div class="spinner" style="margin:0 0 8px"></div>Data ophalen...</div></div>
</div>

<!-- Video table -->
<details class="video-details" id="video-details">
  <summary class="video-summary">
    <span class="summary-chevron">▸</span>
    <h2 id="vid-count-label">Video's</h2>
  </summary>

  <div class="section-header">
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Zoek videotitel..." oninput="renderTable()" />
      <select id="sort-select" onchange="renderTable()">
        <option value="views-desc">Meeste views</option>
        <option value="views-asc">Minste views</option>
        <option value="delta-desc">Meeste groei dit uur</option>
        <option value="delta-day-desc">Meeste groei vandaag (UTC-8)</option>
        <option value="date-desc">Nieuwste eerst</option>
        <option value="title-asc">Titel A–Z</option>
      </select>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="rank">#</th>
          <th></th>
          <th>Titel</th>
          <th onclick="setSortAndRender('views-desc')">Views</th>
          <th onclick="setSortAndRender('delta-desc')">+/− dit uur</th>
          <th onclick="setSortAndRender('delta-day-desc')">+/− vandaag (UTC-8)</th>
        </tr>
      </thead>
      <tbody id="video-tbody">
        <tr><td colspan="6"><div class="state-box"><div class="spinner"></div>Laden...</div></td></tr>
      </tbody>
    </table>
  </div>
</details>

<script>
const fmt = (n) => Number(n).toLocaleString('nl-NL');
// Vaste daggrens UTC-8 (zie fetch_views.py -- DAY_BOUNDARY_TZ -- voor de
// analyse hierachter). Dagtotalen worden hieronder client-side herberekend
// uit de ruwe pub_total-reeks op deze grens (zie computeDayInfo), zodat ook
// dagen van vóór de omschakeling (31 augustus 2026, toen de backend nog
// Pacific Time gebruikte) hier consistent op UTC-8 getoond worden i.p.v. op
// de PT-cijfers waarmee ze destijds zijn opgeslagen.
const DAY_TZ = 'Etc/GMT+8';

function dHtml(d) {
  if (d === null || d === undefined) return '<span class="neu">—</span>';
  const cls = d > 0 ? 'pos' : d < 0 ? 'neg' : 'neu';
  return `<span class="${cls}">${d > 0 ? '+' : ''}${fmt(d)}</span>`;
}

const ARTISTS = {
  taylor:   { label: 'Taylor Swift',              dataFile: 'yt_data.json' },
  drake:    { label: 'Drake',                     dataFile: 'drake_data.json' },
  wallen:   { label: 'Morgan Wallen',              dataFile: 'wallen_data.json' },
  badbunny: { label: 'Bad Bunny',                  dataFile: 'badbunny_data.json' },
  ariana:   { label: 'Ariana Grande',              dataFile: 'ariana_data.json' },
  youngboy: { label: 'YoungBoy Never Broke Again',  dataFile: 'youngboy_data.json' },
  bieber:   { label: 'Justin Bieber',              dataFile: 'bieber_data.json' },
};
let activeArtist = 'taylor';
const artistCache = {}; // artiest-sleutel -> bewaarde { appData, collapsedDays, collapsedChannels } bij tab-wissel

let appData = null;
let collapsedDays = null; // Set van PT-datumsleutels die ingeklapt zijn; null = nog niet geinitialiseerd
let collapsedWeeks = null; // Set van ISO-weeksleutels (binnen de oudere-sectie) die ingeklapt zijn; null = nog niet geinitialiseerd
let collapsedOlder = true; // of de "oudere data"-sectie (alles voorbij de laatste 7 dagen) ingeklapt is
let collapsedChannels = new Set(); // kanalen die de gebruiker heeft ingeklapt in de videolijst
const CHANNEL_ORDER = ['Hoofdkanaal', 'Topic']; // vaste weergavevolgorde; onbekende labels achteraan

function toggleDay(key) {
  if (collapsedDays.has(key)) collapsedDays.delete(key); else collapsedDays.add(key);
  renderLog();
}

function toggleOlder() {
  collapsedOlder = !collapsedOlder;
  renderLog();
}

function toggleWeek(key) {
  if (collapsedWeeks.has(key)) collapsedWeeks.delete(key); else collapsedWeeks.add(key);
  renderLog();
}

function toggleChannel(label) {
  if (collapsedChannels.has(label)) collapsedChannels.delete(label); else collapsedChannels.add(label);
  renderTable();
}

function switchArtist(key) {
  if (key === activeArtist || !ARTISTS[key]) return;

  artistCache[activeArtist] = { appData, collapsedDays, collapsedWeeks, collapsedOlder, collapsedChannels };
  activeArtist = key;

  document.querySelectorAll('.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.artist === key));
  document.getElementById('artist-name').textContent = ARTISTS[key].label;

  const cached = artistCache[key];
  if (cached) {
    appData = cached.appData; collapsedDays = cached.collapsedDays; collapsedWeeks = cached.collapsedWeeks;
    collapsedOlder = cached.collapsedOlder; collapsedChannels = cached.collapsedChannels;
    if (appData) { renderLog(); renderTable(); }
  } else {
    appData = null; collapsedDays = null; collapsedWeeks = null; collapsedOlder = true; collapsedChannels = new Set();
    document.getElementById('log-body').innerHTML = '<div class="log-empty"><div class="spinner" style="margin:0 0 8px"></div>Data ophalen...</div>';
    document.getElementById('video-tbody').innerHTML = '<tr><td colspan="6"><div class="state-box"><div class="spinner"></div>Laden...</div></td></tr>';
  }
  loadData();
}

async function loadData() {
  document.getElementById('btn-refresh').disabled = true;
  document.getElementById('badge-updated').textContent = 'Laden...';
  document.getElementById('badge-updated').className = 'badge';

  const artist = activeArtist; // vastleggen: voorkomt dat een trage fetch de verkeerde tab overschrijft bij wisselen

  try {
    // Cache busting zodat de browser altijd de nieuwste JSON ophaalt
    const resp = await fetch(ARTISTS[artist].dataFile + '?t=' + Date.now());
    if (!resp.ok) throw new Error(`${ARTISTS[artist].dataFile} niet gevonden (${resp.status})`);
    const data = await resp.json();
    if (artist !== activeArtist) return; // gebruiker is intussen naar een andere tab gewisseld
    appData = data;
    renderLog();
    renderTable();
    const b = document.getElementById('badge-updated');
    // Toon tijdstip van meest recente server-run
    const lastTs = appData.log?.[0]?.ts;
    b.textContent = lastTs
      ? 'Server: ' + new Date(lastTs).toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit', timeZone: DAY_TZ }) + ' (UTC-8)'
      : 'Geladen';
    b.className = 'badge ok';
  } catch (err) {
    if (artist !== activeArtist) return;
    document.getElementById('log-body').innerHTML =
      `<div class="log-empty"><span class="err-txt">Fout: </span>${err.message}<br><small>Zorg dat fetch_views.py minstens één keer gedraaid heeft voor ${ARTISTS[artist].label}.</small></div>`;
    const b = document.getElementById('badge-updated');
    b.textContent = 'Fout';
    b.className = 'badge err';
  }

  document.getElementById('btn-refresh').disabled = false;
  // Automatisch herladen na 5 minuten (data komt van server, geen API-quota kosten)
  setTimeout(loadData, 5 * 60 * 1000);
}

function renderLog() {
  const log = appData?.log || [];
  const el  = document.getElementById('log-body');
  if (!log.length) { el.innerHTML = '<div class="log-empty">Nog geen data. Draai fetch_views.php eerst handmatig.</div>'; return; }

  const ptDateKey    = (ts) => new Date(ts).toLocaleDateString('en-CA', { timeZone: DAY_TZ }); // YYYY-MM-DD, sorteerbaar
  const ptDateLabel  = (ts) => new Date(ts).toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: DAY_TZ });
  const ptShortLabel = (ts) => new Date(ts).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', timeZone: DAY_TZ });
  const todayKey     = new Date().toLocaleDateString('en-CA', { timeZone: DAY_TZ });

  const addDaysToKey = (key, n) => {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toLocaleDateString('en-CA', { timeZone: 'UTC' });
  };

  // ---- Releasedagen markeren ----
  // published_at komt rechtstreeks van YouTube (niet van onze eigen ontdekking),
  // dus dit is immuun voor het "catalogus-inhaalslag"-probleem (oude video's die
  // onze tracker toevallig pas later ontdekt). Een release trekt vaak pas de
  // volgende dag zijn grootste kijkpiek (zie analyse in het gesprek), dus een
  // dag wordt gemarkeerd als er ÓF die dag ÓF de dag ervoor een video uitkwam.
  const releaseInfo = {};
  for (const v of appData.videos || []) {
    if (!v.published_at) continue;
    const pubKey = ptDateKey(v.published_at);
    for (const key of [pubKey, addDaysToKey(pubKey, 1)]) {
      (releaseInfo[key] ??= []).push(v.title);
    }
  }

  // ---- Dagtotalen client-side herberekenen op de vaste UTC-8-grens ----
  // De backend sloeg vóór 31 augustus 2026 final_day_total/views_today nog
  // op basis van Pacific Time op. In plaats van die (deels PT-, deels
  // UTC-8-gebaseerde) velden te tonen, interpoleren we hier zelf de
  // cumulatieve pub_total-reeks op elke UTC-8-middernacht -- exact dezelfde
  // aanpak als fetch_views.py's eigen middernacht-interpolatie, maar dan
  // uniform toegepast op het hele log, ook met terugwerkende kracht.
  const pts = log.map(e => ({ ms: new Date(e.ts).getTime(), pub: e.pub_total, vc: e.video_count }))
                 .sort((a, b) => a.ms - b.ms);

  // Interpoleert de cumulatieve pub_total op een exact UTC-tijdstip. Retourneert
  // null als de grens buiten het gemeten bereik valt, of als het video-aantal
  // net op de omliggende metingen verschilt (catalogus-sprong -- zie eerdere
  // analyse: dan zou "groei" eigenlijk een nieuw/verdwenen video zijn).
  const interpAt = (boundaryMs) => {
    let prev = null;
    for (const p of pts) {
      if (p.ms <= boundaryMs) { prev = p; continue; }
      if (prev === null) return null;
      if (prev.vc !== p.vc) return null;
      if (p.ms === prev.ms) return prev.pub;
      const frac = (boundaryMs - prev.ms) / (p.ms - prev.ms);
      return prev.pub + frac * (p.pub - prev.pub);
    }
    return null; // grens ligt na de laatste meting (dag loopt nog)
  };
  const vcConstantBetween = (loMs, hiMs) => {
    const seen = new Set(pts.filter(p => p.ms >= loMs && p.ms <= hiMs).map(p => p.vc));
    return seen.size <= 1;
  };

  // Per UTC-8-kalenderdag: begin- en (indien al voorbij) eindtotaal, plus of
  // de catalogus in dat venster stabiel bleef (anders niet betrouwbaar).
  const dayInfo = {};
  for (const key of new Set(log.map(e => ptDateKey(e.ts)))) {
    const [y, m, d] = key.split('-').map(Number);
    const startMs = Date.UTC(y, m - 1, d) + 8 * 3600 * 1000; // 00:00 UTC-8
    const endMs   = startMs + 24 * 3600 * 1000;
    const lastMs  = pts[pts.length - 1].ms;
    dayInfo[key] = {
      startTotal: interpAt(startMs),
      endTotal:   endMs <= lastMs ? interpAt(endMs) : null, // null = dag loopt nog
      valid:      vcConstantBetween(startMs, Math.min(endMs, lastMs)),
      videoCount: log.find(e => ptDateKey(e.ts) === key)?.video_count,
    };
  }
  const latestPub = pts[pts.length - 1].pub;

  // Dagtotaal: herberekend eindtotaal min begintotaal (lopende dag: t/m de
  // laatste meting). Valt terug op het oude, backend-opgeslagen cijfer als de
  // herberekening niet betrouwbaar is (catalogus-wijziging exact op de grens).
  const dayTotalFor = (key, fallback) => {
    const info = dayInfo[key];
    if (!info || info.startTotal == null || !info.valid) return fallback;
    const end = info.endTotal != null ? info.endTotal : latestPub;
    return Math.round(end - info.startTotal);
  };
  // "Views vandaag" per meting: die meting se pub_total min de UTC-8-daggrens
  // van díé dag -- i.p.v. het (deels PT-gebaseerde) views_today-veld.
  const viewsTodayFor = (e) => {
    const info = dayInfo[ptDateKey(e.ts)];
    if (!info || info.startTotal == null || !info.valid) return e.views_today;
    return Math.round(e.pub_total - info.startTotal);
  };

  // ISO-8601-weeksleutel (bv. "2026-W34") voor een PT-datumsleutel, voor het
  // groeperen van de oudere-dan-7-dagen sectie per week.
  const isoWeekKey = (dateKeyStr) => {
    const [y, m, d] = dateKeyStr.split('-').map(Number);
    const date = new Date(Date.UTC(y, m - 1, d));
    const dayNum = date.getUTCDay() || 7; // maandag=1 .. zondag=7
    date.setUTCDate(date.getUTCDate() + 4 - dayNum); // naar donderdag van deze ISO-week
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    const week = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    return `${date.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
  };

  // Standaard: alleen vandaag uitgeklapt, oudere dagen/weken ingeklapt. Wordt
  // eenmalig bepaald en blijft daarna staan totdat de gebruiker zelf toggelt.
  if (collapsedDays === null) {
    const allKeys = [...new Set(log.map(e => ptDateKey(e.ts)))];
    collapsedDays = new Set(allKeys.filter(k => k !== todayKey));
  }
  if (collapsedWeeks === null) {
    collapsedWeeks = new Set(log.map(e => isoWeekKey(ptDateKey(e.ts))));
  }

  // 00:00-baseline van een groep: het herberekende begintotaal van die
  // UTC-8-dag (zie dayInfo hierboven). Valt terug op het oude, per-meting
  // opgeslagen begintotaal als de herberekening niet betrouwbaar is -- en
  // gebruikt daarvoor de OUDSTE meting van de dag (dichtst bij middernacht),
  // niet de nieuwste: `entry` is de nieuwste meting van de groep en diens
  // eigen views_today kan toevallig al bijna 0 zijn (bv. vlak na een
  // backend-baseline-reset), wat de terugval-berekening zou laten lijken op
  // het eínde van de dag i.p.v. het begin.
  const openingBaseline = (key, entry) => {
    const info = dayInfo[key];
    if (info && info.startTotal != null && info.valid) {
      return { baseTotal: Math.round(info.startTotal), videoCount: info.videoCount, interpolated: true, gapMinutes: null };
    }
    const dayEntries = log.filter(x => ptDateKey(x.ts) === key);
    const oldest = dayEntries[dayEntries.length - 1] || entry;
    if (!Number.isFinite(oldest.views_today)) return null;
    return {
      baseTotal:    oldest.pub_total - oldest.views_today,
      videoCount:   oldest.video_count,
      interpolated: false,
      gapMinutes:   null,
    };
  };

  // "00:00"-regel: zowel voor het begin van een dag (viewsAtRow = 0) als het einde
  // ervan (viewsAtRow = het dagtotaal, want dat is dezelfde 00:00 als het begin
  // van de eropvolgende dag). Toont ook het aantal video's op dat moment, want
  // dat kan verschillen tussen twee opeenvolgende dagen (dagelijkse video-lijst-
  // verversing ontdekt of verliest af en toe catalogus-video's) -- zonder die
  // context leek hetzelfde geschatte totaal op twee plekken een fout.
  const midnightRowHtml = (baseTotal, videoCount, viewsAtRow, interpolated, gapMinutes, deltaHour) => {
    if (baseTotal === null) return '';
    const title = interpolated
      ? (gapMinutes != null
          ? `Geïnterpoleerd tussen de laatste meting vóór en de eerste ná middernacht (meetgat ${gapMinutes} min)`
          : 'Geïnterpoleerd op de UTC-8-daggrens uit de omliggende metingen')
      : 'Teruggerekend uit de eerst gemeten waarde van die dag (geen interpolatie beschikbaar)';
    return `<tr class="midnight-row" title="${title}">
      <td>00:00 <span class="est-tag">geschat</span></td>
      <td>—</td>
      <td>${fmt(baseTotal)}</td>
      <td>${videoCount ?? '—'}</td>
      <td>${dHtml(viewsAtRow)}</td>
      <td>${deltaHour == null ? '—' : dHtml(deltaHour)}</td>
    </tr>`;
  };

  // Sluitings-00:00 van een afgeronde dag: het herberekende eindtotaal van
  // die UTC-8-dag (dayInfo). Valt terug op het oude, backend-opgeslagen
  // final_day_total als de herberekening niet betrouwbaar is.
  const closingTotal = (entry, key) => {
    const info = dayInfo[key];
    if (info && info.startTotal != null && info.endTotal != null && info.valid) {
      const total = Math.round(info.endTotal - info.startTotal);
      return {
        baseTotal:    Math.round(info.endTotal),
        videoCount:   info.videoCount,
        viewsAtRow:   total,
        interpolated: true,
        gapMinutes:   null,
        deltaHour:    Math.round(info.endTotal - entry.pub_total),
      };
    }
    // De backend hangt final_day_total op aan de meting die ZIJ als laatste van
    // de (destijds PT-gebaseerde) dag zag -- door de UTC-8-daggrens kan dat een
    // andere meting zijn dan degene die hier als "nieuwste van de groep" wordt
    // doorgegeven. Zoek daarom in de hele groep i.p.v. alleen op `entry`.
    const withTotal = entry.final_day_total !== undefined ? entry : log.find(x => ptDateKey(x.ts) === key && x.final_day_total !== undefined);
    // Een negatief final_day_total is de "vals-negatief"-bug uit half augustus
    // 2026 (gefixt op 20-08) -- die waarde was toen al fout, niet betrouwbaar
    // om te tonen.
    if (!withTotal || !Number.isFinite(withTotal.final_day_total) || withTotal.final_day_total < 0) return null;
    // final_day_pub_total/-video_count/etc. bestaan pas sinds 16 augustus 2026;
    // vóór die datum staat er alleen het kale final_day_total -- val dan terug
    // op de eigen pub_total/video_count van die meting i.p.v. de rij te verbergen.
    const hasSiblings = Number.isFinite(withTotal.final_day_pub_total);
    return {
      baseTotal:    hasSiblings ? withTotal.final_day_pub_total : withTotal.pub_total,
      videoCount:   hasSiblings ? withTotal.final_day_video_count : withTotal.video_count,
      viewsAtRow:   withTotal.final_day_total,
      interpolated: hasSiblings ? withTotal.final_day_interpolated : false,
      gapMinutes:   hasSiblings ? withTotal.final_day_gap_minutes : null,
      deltaHour:    hasSiblings ? withTotal.final_day_pub_total - entry.pub_total : null,
    };
  };

  // Rendert dag-headers + metingen + 00:00-regels voor een aaneengesloten,
  // nieuw-naar-oud gesorteerde subset van het log. Wordt gebruikt voor zowel de
  // losse recente dagen als, genest, voor elke week in de oudere-sectie.
  const renderDayRows = (entries) => {
    let rows = '';
    let groupKey = null;
    let groupLatestEntry = null; // meest recente meting van de lopende groep, voor de 00:00-regel erna

    entries.forEach((e) => {
      const key = ptDateKey(e.ts);
      if (key !== groupKey) {
        if (groupKey !== null) {
          const opening = openingBaseline(groupKey, groupLatestEntry);
          if (!collapsedDays.has(groupKey) && opening) {
            rows += midnightRowHtml(opening.baseTotal, opening.videoCount, 0, opening.interpolated, opening.gapMinutes, null);
          }
        }
        groupKey = key;
        groupLatestEntry = e;
        const isToday = key === todayKey;
        const isCollapsed = collapsedDays.has(key);

        // Dagtotaal: herberekend op de UTC-8-daggrens (zie dayInfo hierboven),
        // met terugvalwaarde het oude, backend-opgeslagen cijfer. Voor vandaag
        // is de lopende views_today altijd het juiste (enige) cijfer; voor een
        // afgesloten dag zónder betrouwbare herberekening én zónder
        // final_day_total (dagen van vóór 14 augustus 2026, toen dat veld nog
        // niet bestond) is er écht geen betrouwbaar cijfer -- toon dan "—"
        // i.p.v. het potentieel sterk misleidende ruwe views_today.
        const withTotal = e.final_day_total !== undefined ? e : log.find(x => ptDateKey(x.ts) === key && x.final_day_total !== undefined);
        // Negatief final_day_total = de "vals-negatief"-bug uit half augustus
        // 2026 (gefixt op 20-08) -- niet betrouwbaar, dan liever "—".
        const fallback = isToday
          ? e.views_today
          : (withTotal && Number.isFinite(withTotal.final_day_total) && withTotal.final_day_total >= 0 ? withTotal.final_day_total : null);
        const dayTotal = dayTotalFor(key, fallback);

        rows += `<tr class="day-row" onclick="toggleDay('${key}')"><td colspan="6">
          <div class="day-row-inner">
            <span class="day-label"><span class="day-chevron">${isCollapsed ? '▸' : '▾'}</span>${ptDateLabel(e.ts)}${isToday ? '<span class="badge ok day-badge">vandaag</span>' : ''}${releaseInfo[key] ? `<span class="badge release day-badge" title="Nieuwe video: ${esc(releaseInfo[key].join(', '))}">🎵 nieuwe video</span>` : ''}</span>
            <span class="day-total">${dHtml(dayTotal)} views</span>
          </div>
        </td></tr>`;

        // Sluitings-00:00: het einde van deze dag, meteen onder de header, zodat een
        // dag ook los (ingeklapte buurdag) leesbaar is als 00:00 -> records -> 00:00.
        // Gebruikt de eigen final_day_*-velden van deze dag (zie hierboven), niet
        // de baseline van de volgende dag.
        if (!isCollapsed && !isToday) {
          const closing = closingTotal(e, key);
          if (closing) {
            rows += midnightRowHtml(closing.baseTotal, closing.videoCount, closing.viewsAtRow, closing.interpolated, closing.gapMinutes, closing.deltaHour);
          }
        }
      }
      if (!collapsedDays.has(groupKey)) {
        const ts = new Date(e.ts).toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit', timeZone: DAY_TZ });
        rows += `<tr class="${e === log[0] ? 'new-row' : ''}">
          <td>${ts}</td>
          <td>${fmt(e.official_total ?? 0)}</td>
          <td>${fmt(e.pub_total)}</td>
          <td>${e.video_count ?? '—'}</td>
          <td>${dHtml(viewsTodayFor(e))}</td>
          <td>${dHtml(e.delta_hour)}</td>
        </tr>`;
      }
    });
    if (groupKey !== null) {
      const opening = openingBaseline(groupKey, groupLatestEntry);
      if (!collapsedDays.has(groupKey) && opening) {
        rows += midnightRowHtml(opening.baseTotal, opening.videoCount, 0, opening.interpolated, opening.gapMinutes, null);
      }
    }
    return rows;
  };

  // Laatste 7 PT-dagen (inclusief vandaag) los tonen; alles ouder daarvan gaat
  // in een aparte, standaard ingeklapte sectie, onderverdeeld per ISO-week.
  const recentDayKeys = [...new Set(log.map(e => ptDateKey(e.ts)))].slice(0, 7);
  const recentKeySet  = new Set(recentDayKeys);
  const recentEntries = log.filter(e => recentKeySet.has(ptDateKey(e.ts)));
  const olderEntries  = log.filter(e => !recentKeySet.has(ptDateKey(e.ts)));

  let rows = renderDayRows(recentEntries);

  if (olderEntries.length) {
    const olderDayCount = new Set(olderEntries.map(e => ptDateKey(e.ts))).size;
    rows += `<tr class="day-row older-row" onclick="toggleOlder()"><td colspan="6">
      <div class="day-row-inner">
        <span class="day-label"><span class="day-chevron">${collapsedOlder ? '▸' : '▾'}</span>Oudere data</span>
        <span class="day-total">${olderDayCount} ${olderDayCount === 1 ? 'dag' : "dagen"}</span>
      </div>
    </td></tr>`;

    if (!collapsedOlder) {
      let weekKey = null;
      let weekEntries = [];
      const flushWeek = () => {
        if (weekKey === null) return;
        const isCollapsed = collapsedWeeks.has(weekKey);
        const weekNum     = weekKey.split('-W')[1].replace(/^0/, '');
        const dayCount    = new Set(weekEntries.map(e => ptDateKey(e.ts))).size;
        const oldest      = weekEntries[weekEntries.length - 1];
        const newest      = weekEntries[0];
        rows += `<tr class="day-row week-row" onclick="toggleWeek('${weekKey}')"><td colspan="6">
          <div class="day-row-inner">
            <span class="day-label"><span class="day-chevron">${isCollapsed ? '▸' : '▾'}</span>Week ${weekNum} · ${ptShortLabel(oldest.ts)} – ${ptShortLabel(newest.ts)}</span>
            <span class="day-total">${dayCount} ${dayCount === 1 ? 'dag' : 'dagen'}</span>
          </div>
        </td></tr>`;
        if (!isCollapsed) rows += renderDayRows(weekEntries);
      };
      olderEntries.forEach((e) => {
        const wk = isoWeekKey(ptDateKey(e.ts));
        if (wk !== weekKey) { flushWeek(); weekKey = wk; weekEntries = []; }
        weekEntries.push(e);
      });
      flushWeek();
    }
  }

  el.innerHTML = `<table class="log-table">
    <thead><tr>
      <th>Tijdstip (UTC-8)</th>
      <th>Officieel totaal</th>
      <th>Som publieke video's</th>
      <th>Aantal video's</th>
      <th>Views vandaag (UTC-8)</th>
      <th>+/− vorige meting</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderTable() {
  if (!appData?.videos) return;
  const query = document.getElementById('search-input').value.toLowerCase();
  const sort  = document.getElementById('sort-select').value;

  // views per video uit last_snapshot en day_baseline
  const lastViews = appData.last_snapshot?.views ?? {};
  const dayViews  = appData.day_baseline?.views   ?? {};

  const dHour = (v) => lastViews[v.id] !== undefined ? v.views - lastViews[v.id] : null;
  // dag delta: current minus dag-baseline
  const dDay  = (v) => dayViews[v.id]  !== undefined ? v.views - dayViews[v.id]  : null;

  const sortFn = (a, b) => {
    if (sort === 'views-desc')     return b.views - a.views;
    if (sort === 'views-asc')      return a.views - b.views;
    if (sort === 'title-asc')      return a.title.localeCompare(b.title);
    if (sort === 'date-desc')      return new Date(b.published_at) - new Date(a.published_at);
    if (sort === 'delta-desc')     return (dHour(b) ?? -Infinity) - (dHour(a) ?? -Infinity);
    if (sort === 'delta-day-desc') return (dDay(b)  ?? -Infinity) - (dDay(a)  ?? -Infinity);
    return 0;
  };

  const filtered = appData.videos.filter(v => v.title.toLowerCase().includes(query));

  document.getElementById('vid-count-label').textContent =
    `${filtered.length} van ${appData.videos.length} video's`;

  // Groeperen per kanaal (Hoofdkanaal / Topic / evt. toekomstige kanalen)
  const groups = new Map();
  for (const v of filtered) {
    const label = v.channel || 'Overig';
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(v);
  }
  const orderedLabels = [...groups.keys()].sort((a, b) => {
    const ia = CHANNEL_ORDER.indexOf(a), ib = CHANNEL_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  const rowHtml = (v, i) => {
    const pubDate = v.published_at
      ? new Date(v.published_at).toLocaleDateString('nl-NL', { year:'numeric', month:'short', day:'numeric', timeZone: DAY_TZ })
      : '';
    return `<tr>
      <td class="rank">${i + 1}</td>
      <td><img src="${v.thumbnail}" alt="" loading="lazy" width="60" height="34" style="border-radius:3px;display:block;object-fit:cover"/></td>
      <td class="video-title">
        <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${esc(v.title)}</a>
        <div class="vid-date">${pubDate}</div>
      </td>
      <td class="views-num">${fmt(v.views)}</td>
      <td>${dHtml(dHour(v))}</td>
      <td>${dHtml(dDay(v))}</td>
    </tr>`;
  };

  let rows = '';
  for (const label of orderedLabels) {
    const group = groups.get(label).sort(sortFn);
    const totalViews = group.reduce((s, v) => s + v.views, 0);
    const isCollapsed = collapsedChannels.has(label);
    rows += `<tr class="day-row" onclick="toggleChannel('${label}')"><td colspan="6">
      <div class="day-row-inner">
        <span class="day-label"><span class="day-chevron">${isCollapsed ? '▸' : '▾'}</span>${esc(label)}</span>
        <span class="day-total">${fmt(group.length)} video's · ${fmt(totalViews)} views</span>
      </div>
    </td></tr>`;
    if (!isCollapsed) rows += group.map(rowHtml).join('');
  }

  document.getElementById('video-tbody').innerHTML =
    rows || `<tr><td colspan="6"><div class="state-box">Geen video's gevonden.</div></td></tr>`;
}

function setSortAndRender(val) { document.getElementById('sort-select').value = val; renderTable(); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

loadData();
</script>
</body>
</html>
