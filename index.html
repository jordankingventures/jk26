<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT View Tracker</title>
  <style>
    :root {
      --bg: #0f0f13; --surface: #1a1a24; --surface2: #22222f;
      --border: #2a2a3a; --accent: #7c5cfc; --accent2: #fc5c7d;
      --green: #2ecc71; --text: #e8e8f0; --muted: #6666aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh; padding: 20px 20px 60px;
      max-width: 1100px; margin: 0 auto;
      overflow-x: hidden;
    }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
    h1 { font-size: 1.1rem; font-weight: 700; color: var(--muted); }
    h1 span { color: var(--text); }

    /* Artiest-tabs */
    .tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab {
      background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
      color: var(--muted); font-size: 0.82rem; font-weight: 600; padding: 7px 16px; cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: #fff; background: var(--accent); border-color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 0.75rem; color: var(--muted); padding: 4px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
    .badge.ok { color: var(--green); border-color: var(--green); }
    .badge.err { color: var(--accent2); border-color: var(--accent2); }
    button.refresh {
      background: var(--accent); border: none; border-radius: 7px;
      color: #fff; cursor: pointer; font-size: 0.82rem; font-weight: 600;
      padding: 6px 14px; transition: opacity .15s;
    }
    button.refresh:hover { opacity: .85; }
    button.refresh:disabled { opacity: .4; cursor: not-allowed; }

    /* Log */
    .log-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface2);
    }
    .log-header h2 { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .log-empty { padding: 16px; color: var(--muted); font-size: 0.8rem; }

    #log-body { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .log-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .log-table th {
      text-align: left; color: var(--muted); font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: .05em;
      padding: 7px 14px; border-bottom: 1px solid var(--border); font-weight: 600; white-space: nowrap;
    }
    .log-table td { padding: 8px 14px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .log-table tr:last-child td { border-bottom: none; }
    .log-table tr:hover td { background: var(--surface2); }
    .new-row td { animation: rowFade .6s ease; }
    @keyframes rowFade { from { background: #7c5cfc18; } to { background: transparent; } }

    /* Dag-groepering in refresh log (inklapbaar) */
    .day-row { cursor: pointer; user-select: none; }
    .day-row td { background: var(--surface2); padding: 9px 14px 8px; border-bottom: 1px solid var(--border); }
    .day-row:hover td { background: var(--surface2); filter: brightness(1.12); }
    .day-row:first-child td { border-top: none; }
    .day-row-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; width: 100%; }
    .day-label { flex: 1 1 auto; white-space: nowrap; font-weight: 700; font-size: 0.8rem; text-transform: capitalize; color: var(--text); }
    .day-chevron { display: inline-block; width: 14px; color: var(--muted); font-size: 0.7rem; }
    .day-badge { margin-left: 8px; padding: 2px 8px; font-size: 0.65rem; vertical-align: 1px; }
    .day-total { flex: 0 0 auto; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.85rem; white-space: nowrap; }

    /* Berekend 00:00-record onderaan elke dag */
    .midnight-row td { font-style: italic; color: var(--muted); border-bottom: 1px dashed var(--border); cursor: help; }
    .midnight-row:hover td { background: var(--surface2); }
    .est-tag { font-size: 0.6rem; font-style: normal; text-transform: uppercase; letter-spacing: .03em; padding: 1px 6px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); margin-left: 4px; }

    /* Delta colours */
    .pos { color: var(--green); } .neg { color: var(--accent2); } .neu { color: var(--muted); }

    /* Video table (inklapbaar) */
    .video-details { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    .video-summary {
      display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer;
      padding: 10px 16px; background: var(--surface2);
    }
    .video-summary::-webkit-details-marker { display: none; }
    .video-summary h2 { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .summary-chevron { display: inline-block; color: var(--muted); font-size: 0.7rem; transition: transform .15s; }
    .video-details[open] .summary-chevron { transform: rotate(90deg); }
    .video-details[open] .video-summary { border-bottom: 1px solid var(--border); }

    .section-header { display: flex; align-items: center; justify-content: flex-end; margin: 12px 16px 10px; gap: 10px; flex-wrap: wrap; }
    .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar input[type=text] {
      background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-size: 0.82rem; padding: 6px 12px; width: 220px; max-width: 100%;
    }
    .toolbar input[type=text]:focus { outline: none; border-color: var(--accent); }
    .toolbar select {
      background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
      color: var(--text); font-size: 0.8rem; padding: 6px 10px; cursor: pointer;
    }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-top: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
    thead { background: var(--surface2); }
    th {
      text-align: left; color: var(--muted); font-weight: 600;
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: .05em;
      padding: 9px 14px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap;
    }
    th:hover { color: var(--text); }
    td { padding: 8px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .rank { color: var(--muted); font-size: 0.75rem; width: 32px; }
    .thumb img { width: 60px; height: 34px; object-fit: cover; border-radius: 3px; display: block; }
    .video-title a { color: var(--text); text-decoration: none; font-weight: 500; }
    .video-title a:hover { color: var(--accent); }
    .vid-date { color: var(--muted); font-size: 0.72rem; margin-top: 2px; }
    .views-num { font-variant-numeric: tabular-nums; font-weight: 600; }

    .state-box { text-align: center; padding: 48px 20px; color: var(--muted); }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-txt { color: var(--accent2); font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; }

    /* Mobiel */
    @media (max-width: 640px) {
      body { padding: 14px 10px 40px; }
      header { flex-wrap: wrap; gap: 8px; }
      h1 { font-size: 0.95rem; }
      .header-right { width: 100%; justify-content: space-between; }

      .log-table, table { font-size: 0.74rem; }
      .log-table th, table th { padding: 6px 8px; }
      .log-table td, table td { padding: 6px 8px; }

      .section-header { gap: 8px; }
      .toolbar { width: 100%; }
      .toolbar input[type=text] { flex: 1 1 auto; width: auto; min-width: 0; }
      .toolbar select { flex: 0 0 auto; }

      .day-row td { padding: 8px 8px 7px; }
      .day-label { font-size: 0.74rem; }
      .day-total { font-size: 0.78rem; }
      .midnight-row td { padding: 6px 8px; }

      .thumb img { width: 44px; height: 25px; }
      .rank { width: 22px; }
    }
  </style>
</head>
<body>

<header>
  <h1>📺 <span id="artist-name">Taylor Swift</span> — View Tracker</h1>
  <div class="header-right">
    <span class="badge" id="badge-updated">Laden...</span>
    <button class="refresh" id="btn-refresh" onclick="loadData()">↻ Ververs</button>
  </div>
</header>

<div class="tabs" id="artist-tabs">
  <button class="tab active" data-artist="taylor" onclick="switchArtist('taylor')">Taylor Swift</button>
  <button class="tab" data-artist="drake" onclick="switchArtist('drake')">Drake</button>
  <button class="tab" data-artist="wallen" onclick="switchArtist('wallen')">Morgan Wallen</button>
  <button class="tab" data-artist="badbunny" onclick="switchArtist('badbunny')">Bad Bunny</button>
  <button class="tab" data-artist="ariana" onclick="switchArtist('ariana')">Ariana Grande</button>
  <button class="tab" data-artist="youngboy" onclick="switchArtist('youngboy')">YoungBoy NBA</button>
  <button class="tab" data-artist="bieber" onclick="switchArtist('bieber')">Justin Bieber</button>
</div>

<!-- Log -->
<div class="log-wrap">
  <div class="log-header">
    <h2>Refresh log</h2>
  </div>
  <div id="log-body"><div class="log-empty"><div class="spinner" style="margin:0 0 8px"></div>Data ophalen...</div></div>
</div>

<!-- Video table -->
<details class="video-details" id="video-details">
  <summary class="video-summary">
    <span class="summary-chevron">▸</span>
    <h2 id="vid-count-label">Video's</h2>
  </summary>

  <div class="section-header">
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Zoek videotitel..." oninput="renderTable()" />
      <select id="sort-select" onchange="renderTable()">
        <option value="views-desc">Meeste views</option>
        <option value="views-asc">Minste views</option>
        <option value="delta-desc">Meeste groei dit uur</option>
        <option value="delta-day-desc">Meeste groei vandaag (PT)</option>
        <option value="date-desc">Nieuwste eerst</option>
        <option value="title-asc">Titel A–Z</option>
      </select>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="rank">#</th>
          <th></th>
          <th>Titel</th>
          <th onclick="setSortAndRender('views-desc')">Views</th>
          <th onclick="setSortAndRender('delta-desc')">+/− dit uur</th>
          <th onclick="setSortAndRender('delta-day-desc')">+/− vandaag (PT)</th>
        </tr>
      </thead>
      <tbody id="video-tbody">
        <tr><td colspan="6"><div class="state-box"><div class="spinner"></div>Laden...</div></td></tr>
      </tbody>
    </table>
  </div>
</details>

<script>
const fmt = (n) => Number(n).toLocaleString('nl-NL');
const PT_TZ = 'America/Los_Angeles'; // YouTube Charts / Kalshi-resolver hanteert deze daggrens

function dHtml(d) {
  if (d === null || d === undefined) return '<span class="neu">—</span>';
  const cls = d > 0 ? 'pos' : d < 0 ? 'neg' : 'neu';
  return `<span class="${cls}">${d > 0 ? '+' : ''}${fmt(d)}</span>`;
}

const ARTISTS = {
  taylor:   { label: 'Taylor Swift',              dataFile: 'yt_data.json' },
  drake:    { label: 'Drake',                     dataFile: 'drake_data.json' },
  wallen:   { label: 'Morgan Wallen',              dataFile: 'wallen_data.json' },
  badbunny: { label: 'Bad Bunny',                  dataFile: 'badbunny_data.json' },
  ariana:   { label: 'Ariana Grande',              dataFile: 'ariana_data.json' },
  youngboy: { label: 'YoungBoy Never Broke Again',  dataFile: 'youngboy_data.json' },
  bieber:   { label: 'Justin Bieber',              dataFile: 'bieber_data.json' },
};
let activeArtist = 'taylor';
const artistCache = {}; // artiest-sleutel -> bewaarde { appData, collapsedDays, collapsedChannels } bij tab-wissel

let appData = null;
let collapsedDays = null; // Set van PT-datumsleutels die ingeklapt zijn; null = nog niet geinitialiseerd
let collapsedChannels = new Set(); // kanalen die de gebruiker heeft ingeklapt in de videolijst
const CHANNEL_ORDER = ['Hoofdkanaal', 'Topic']; // vaste weergavevolgorde; onbekende labels achteraan

function toggleDay(key) {
  if (collapsedDays.has(key)) collapsedDays.delete(key); else collapsedDays.add(key);
  renderLog();
}

function toggleChannel(label) {
  if (collapsedChannels.has(label)) collapsedChannels.delete(label); else collapsedChannels.add(label);
  renderTable();
}

function switchArtist(key) {
  if (key === activeArtist || !ARTISTS[key]) return;

  artistCache[activeArtist] = { appData, collapsedDays, collapsedChannels };
  activeArtist = key;

  document.querySelectorAll('.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.artist === key));
  document.getElementById('artist-name').textContent = ARTISTS[key].label;

  const cached = artistCache[key];
  if (cached) {
    appData = cached.appData; collapsedDays = cached.collapsedDays; collapsedChannels = cached.collapsedChannels;
    if (appData) { renderLog(); renderTable(); }
  } else {
    appData = null; collapsedDays = null; collapsedChannels = new Set();
    document.getElementById('log-body').innerHTML = '<div class="log-empty"><div class="spinner" style="margin:0 0 8px"></div>Data ophalen...</div>';
    document.getElementById('video-tbody').innerHTML = '<tr><td colspan="6"><div class="state-box"><div class="spinner"></div>Laden...</div></td></tr>';
  }
  loadData();
}

async function loadData() {
  document.getElementById('btn-refresh').disabled = true;
  document.getElementById('badge-updated').textContent = 'Laden...';
  document.getElementById('badge-updated').className = 'badge';

  const artist = activeArtist; // vastleggen: voorkomt dat een trage fetch de verkeerde tab overschrijft bij wisselen

  try {
    // Cache busting zodat de browser altijd de nieuwste JSON ophaalt
    const resp = await fetch(ARTISTS[artist].dataFile + '?t=' + Date.now());
    if (!resp.ok) throw new Error(`${ARTISTS[artist].dataFile} niet gevonden (${resp.status})`);
    const data = await resp.json();
    if (artist !== activeArtist) return; // gebruiker is intussen naar een andere tab gewisseld
    appData = data;
    renderLog();
    renderTable();
    const b = document.getElementById('badge-updated');
    // Toon tijdstip van meest recente server-run
    const lastTs = appData.log?.[0]?.ts;
    b.textContent = lastTs
      ? 'Server: ' + new Date(lastTs).toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit', timeZone: PT_TZ }) + ' PT'
      : 'Geladen';
    b.className = 'badge ok';
  } catch (err) {
    if (artist !== activeArtist) return;
    document.getElementById('log-body').innerHTML =
      `<div class="log-empty"><span class="err-txt">Fout: </span>${err.message}<br><small>Zorg dat fetch_views.py minstens één keer gedraaid heeft voor ${ARTISTS[artist].label}.</small></div>`;
    const b = document.getElementById('badge-updated');
    b.textContent = 'Fout';
    b.className = 'badge err';
  }

  document.getElementById('btn-refresh').disabled = false;
  // Automatisch herladen na 5 minuten (data komt van server, geen API-quota kosten)
  setTimeout(loadData, 5 * 60 * 1000);
}

function renderLog() {
  const log = appData?.log || [];
  const el  = document.getElementById('log-body');
  if (!log.length) { el.innerHTML = '<div class="log-empty">Nog geen data. Draai fetch_views.php eerst handmatig.</div>'; return; }

  const ptDateKey   = (ts) => new Date(ts).toLocaleDateString('en-CA', { timeZone: PT_TZ }); // YYYY-MM-DD, sorteerbaar
  const ptDateLabel = (ts) => new Date(ts).toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: PT_TZ });
  const todayKey    = new Date().toLocaleDateString('en-CA', { timeZone: PT_TZ });

  // Standaard: alleen vandaag uitgeklapt, oudere dagen ingeklapt. Wordt eenmalig
  // bepaald en blijft daarna staan totdat de gebruiker zelf een dag toggelt.
  if (collapsedDays === null) {
    const allKeys = [...new Set(log.map(e => ptDateKey(e.ts)))];
    collapsedDays = new Set(allKeys.filter(k => k !== todayKey));
  }

  // 00:00-baseline van een afgeronde groep: teruggerekend uit wat al gelogd staat
  // (pub_total - views_today van de laatste/meest recente meting van die dag).
  const openingBaseline = (key, entry) => {
    if (!Number.isFinite(entry.views_today)) return null;
    const baseline = appData.day_baseline;
    return {
      baseTotal:    entry.pub_total - entry.views_today,
      videoCount:   entry.video_count,
      interpolated: key === todayKey && baseline?.date === key && baseline?.interpolated,
      gapMinutes:   baseline?.gap_minutes,
    };
  };

  // "00:00"-regel: zowel voor het begin van een dag (viewsAtRow = 0) als het einde
  // ervan (viewsAtRow = het dagtotaal, want dat is dezelfde 00:00 als het begin
  // van de eropvolgende dag). Toont ook het aantal video's op dat moment, want
  // dat kan verschillen tussen twee opeenvolgende dagen (dagelijkse video-lijst-
  // verversing ontdekt of verliest af en toe catalogus-video's) -- zonder die
  // context leek hetzelfde geschatte totaal op twee plekken een fout.
  const midnightRowHtml = (baseTotal, videoCount, viewsAtRow, interpolated, gapMinutes, deltaHour) => {
    if (baseTotal === null) return '';
    const title = interpolated
      ? `Geïnterpoleerd tussen de laatste meting vóór en de eerste ná middernacht (meetgat ${gapMinutes} min)`
      : 'Teruggerekend uit de eerst gemeten waarde van die dag (geen interpolatie beschikbaar)';
    return `<tr class="midnight-row" title="${title}">
      <td>00:00 <span class="est-tag">geschat</span></td>
      <td>—</td>
      <td>${fmt(baseTotal)}</td>
      <td>${videoCount ?? '—'}</td>
      <td>${dHtml(viewsAtRow)}</td>
      <td>${deltaHour == null ? '—' : dHtml(deltaHour)}</td>
    </tr>`;
  };

  // Sluitings-00:00 van een afgeronde dag: de backend berekent dit bij de
  // dagwissel zelf (final_day_*) en telt daarbij uitsluitend de video's mee die
  // díé dag al zelf volgde -- dus niet vervuild door de (grotere of kleinere)
  // videoset van de eropvolgende dag. De "+/- vorige meting" van deze regel is
  // het stukje groei tussen de laatste échte meting van de dag en dit geschatte
  // 00:00-eindpunt -- beide op dezelfde videoset, dus een schone vergelijking.
  const closingTotal = (entry) => {
    if (!Number.isFinite(entry.final_day_total) || !Number.isFinite(entry.final_day_pub_total)) return null;
    return {
      baseTotal:    entry.final_day_pub_total,
      videoCount:   entry.final_day_video_count,
      viewsAtRow:   entry.final_day_total,
      interpolated: entry.final_day_interpolated,
      gapMinutes:   entry.final_day_gap_minutes,
      deltaHour:    entry.final_day_pub_total - entry.pub_total,
    };
  };

  let rows = '';
  let groupKey = null;
  let groupLatestEntry = null; // meest recente meting van de lopende groep, voor de 00:00-regel erna

  log.forEach((e, i) => {
    const key = ptDateKey(e.ts);
    if (key !== groupKey) {
      if (groupKey !== null) {
        const opening = openingBaseline(groupKey, groupLatestEntry);
        if (!collapsedDays.has(groupKey) && opening) {
          rows += midnightRowHtml(opening.baseTotal, opening.videoCount, 0, opening.interpolated, opening.gapMinutes, null);
        }
      }
      groupKey = key;
      groupLatestEntry = e;
      const isToday = key === todayKey;
      const isCollapsed = collapsedDays.has(key);

      // Dagtotaal: de backend berekent bij elke dagwissel een gecorrigeerd
      // "final_day_total" voor de zojuist afgesloten dag (inclusief het stukje
      // groei tot middernacht, maar zonder vervuiling door nieuw ontdekte of
      // verdwenen video's -- zie fetch_views.py). Gebruik dat zodra het er is;
      // val anders terug op de laatst gemeten "views vandaag" van die dag zelf
      // (bv. voor oudere dagen van vóór deze fix, of de nog lopende huidige dag).
      const dayTotal = (!isToday && Number.isFinite(e.final_day_total)) ? e.final_day_total : e.views_today;

      rows += `<tr class="day-row" onclick="toggleDay('${key}')"><td colspan="6">
        <div class="day-row-inner">
          <span class="day-label"><span class="day-chevron">${isCollapsed ? '▸' : '▾'}</span>${ptDateLabel(e.ts)}${isToday ? '<span class="badge ok day-badge">vandaag</span>' : ''}</span>
          <span class="day-total">${dHtml(dayTotal)} views</span>
        </div>
      </td></tr>`;

      // Sluitings-00:00: het einde van deze dag, meteen onder de header, zodat een
      // dag ook los (ingeklapte buurdag) leesbaar is als 00:00 -> records -> 00:00.
      // Gebruikt de eigen final_day_*-velden van deze dag (zie hierboven), niet
      // de baseline van de volgende dag.
      if (!isCollapsed && !isToday) {
        const closing = closingTotal(e);
        if (closing) {
          rows += midnightRowHtml(closing.baseTotal, closing.videoCount, closing.viewsAtRow, closing.interpolated, closing.gapMinutes, closing.deltaHour);
        }
      }
    }
    if (!collapsedDays.has(groupKey)) {
      const ts = new Date(e.ts).toLocaleTimeString('nl-NL', { hour:'2-digit', minute:'2-digit', timeZone: PT_TZ });
      rows += `<tr class="${i === 0 ? 'new-row' : ''}">
        <td>${ts}</td>
        <td>${fmt(e.official_total ?? 0)}</td>
        <td>${fmt(e.pub_total)}</td>
        <td>${e.video_count ?? '—'}</td>
        <td>${dHtml(e.views_today)}</td>
        <td>${dHtml(e.delta_hour)}</td>
      </tr>`;
    }
  });
  if (groupKey !== null) {
    const opening = openingBaseline(groupKey, groupLatestEntry);
    if (!collapsedDays.has(groupKey) && opening) {
      rows += midnightRowHtml(opening.baseTotal, opening.videoCount, 0, opening.interpolated, opening.gapMinutes, null);
    }
  }

  el.innerHTML = `<table class="log-table">
    <thead><tr>
      <th>Tijdstip (PT)</th>
      <th>Officieel totaal</th>
      <th>Som publieke video's</th>
      <th>Aantal video's</th>
      <th>Views vandaag (PT)</th>
      <th>+/− vorige meting</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderTable() {
  if (!appData?.videos) return;
  const query = document.getElementById('search-input').value.toLowerCase();
  const sort  = document.getElementById('sort-select').value;

  // views per video uit last_snapshot en day_baseline
  const lastViews = appData.last_snapshot?.views ?? {};
  const dayViews  = appData.day_baseline?.views   ?? {};

  const dHour = (v) => lastViews[v.id] !== undefined ? v.views - lastViews[v.id] : null;
  // dag delta: current minus dag-baseline
  const dDay  = (v) => dayViews[v.id]  !== undefined ? v.views - dayViews[v.id]  : null;

  const sortFn = (a, b) => {
    if (sort === 'views-desc')     return b.views - a.views;
    if (sort === 'views-asc')      return a.views - b.views;
    if (sort === 'title-asc')      return a.title.localeCompare(b.title);
    if (sort === 'date-desc')      return new Date(b.published_at) - new Date(a.published_at);
    if (sort === 'delta-desc')     return (dHour(b) ?? -Infinity) - (dHour(a) ?? -Infinity);
    if (sort === 'delta-day-desc') return (dDay(b)  ?? -Infinity) - (dDay(a)  ?? -Infinity);
    return 0;
  };

  const filtered = appData.videos.filter(v => v.title.toLowerCase().includes(query));

  document.getElementById('vid-count-label').textContent =
    `${filtered.length} van ${appData.videos.length} video's`;

  // Groeperen per kanaal (Hoofdkanaal / Topic / evt. toekomstige kanalen)
  const groups = new Map();
  for (const v of filtered) {
    const label = v.channel || 'Overig';
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(v);
  }
  const orderedLabels = [...groups.keys()].sort((a, b) => {
    const ia = CHANNEL_ORDER.indexOf(a), ib = CHANNEL_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  const rowHtml = (v, i) => {
    const pubDate = v.published_at
      ? new Date(v.published_at).toLocaleDateString('nl-NL', { year:'numeric', month:'short', day:'numeric', timeZone: PT_TZ })
      : '';
    return `<tr>
      <td class="rank">${i + 1}</td>
      <td><img src="${v.thumbnail}" alt="" loading="lazy" width="60" height="34" style="border-radius:3px;display:block;object-fit:cover"/></td>
      <td class="video-title">
        <a href="https://youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">${esc(v.title)}</a>
        <div class="vid-date">${pubDate}</div>
      </td>
      <td class="views-num">${fmt(v.views)}</td>
      <td>${dHtml(dHour(v))}</td>
      <td>${dHtml(dDay(v))}</td>
    </tr>`;
  };

  let rows = '';
  for (const label of orderedLabels) {
    const group = groups.get(label).sort(sortFn);
    const totalViews = group.reduce((s, v) => s + v.views, 0);
    const isCollapsed = collapsedChannels.has(label);
    rows += `<tr class="day-row" onclick="toggleChannel('${label}')"><td colspan="6">
      <div class="day-row-inner">
        <span class="day-label"><span class="day-chevron">${isCollapsed ? '▸' : '▾'}</span>${esc(label)}</span>
        <span class="day-total">${fmt(group.length)} video's · ${fmt(totalViews)} views</span>
      </div>
    </td></tr>`;
    if (!isCollapsed) rows += group.map(rowHtml).join('');
  }

  document.getElementById('video-tbody').innerHTML =
    rows || `<tr><td colspan="6"><div class="state-box">Geen video's gevonden.</div></td></tr>`;
}

function setSortAndRender(val) { document.getElementById('sort-select').value = val; renderTable(); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

loadData();
</script>
</body>
